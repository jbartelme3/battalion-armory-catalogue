name = "battalion-armory-catalogue"
main = "worker/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "battalion-armory"
database_id = "cf1cb590-c8d1-4a65-b59a-f9af722d7f6f"

[vars]
# Where lockout verification codes are sent after 5 failed login attempts.
ALERT_EMAIL = "jbartelme3@icloud.com"

# Secrets (set with `wrangler secret put NAME`, or in .dev.vars for local dev):
#   SITE_PASSWORD    - the shared password gating the whole site
#   SESSION_SECRET   - random string used to sign the session cookie
#   RESEND_API_KEY   - api key from resend.com, used to email lockout verification codes
